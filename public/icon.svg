<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#090D16" />
  <circle cx="256" cy="256" r="210" stroke="url(#grad1)" stroke-width="6" fill="none" opacity="0.25"/>
  
  <!-- Partner 1 silhouette (Left, green energy) -->
  <g transform="translate(-25, 0)">
    <circle cx="210" cy="160" r="32" fill="url(#grad1)" filter="url(#glow)"/>
    <path d="M 210 205 C 175 205 155 240 155 295 L 180 300 L 195 240 L 210 330 L 175 420 L 205 425 L 235 340 L 250 425 L 280 420 L 245 305 L 260 250 L 285 285 L 305 270 L 265 215 C 250 205 230 205 210 205 Z" fill="url(#grad1)" opacity="0.95"/>
  </g>

  <!-- Partner 2 silhouette (Right, cyan energy) -->
  <g transform="translate(45, 10)">
    <circle cx="280" cy="175" r="28" fill="url(#grad2)" filter="url(#glow)"/>
    <path d="M 280 215 C 250 215 235 245 235 290 L 255 295 L 268 250 L 282 325 L 255 410 L 280 415 L 302 335 L 320 415 L 345 410 L 315 305 L 328 255 L 350 285 L 368 270 L 330 225 C 315 215 298 215 280 215 Z" fill="url(#grad2)" opacity="0.85"/>
  </g>

  <!-- Dynamic Dumbbell / Infinity Bar link -->
  <path d="M 140 260 C 200 230, 312 290, 372 260" stroke="url(#grad1)" stroke-width="10" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  
  <!-- FitDuo text monogram pill -->
  <rect x="136" y="430" width="240" height="42" rx="21" fill="#0F172A" stroke="url(#grad1)" stroke-width="2"/>
  <text x="256" y="458" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="4" fill="#FFFFFF" text-anchor="middle">FIT<tspan fill="#06B6D4">DUO</tspan></text>
</svg>
